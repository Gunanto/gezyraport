<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beranda — GezyRaport</title>
<link rel="stylesheet" href="/css/style.css?v=20261015c">
</head>
<body>
<header class="topbar">
  <div class="brand">🎓 GezyRaport <small>SMPN 1 Punggur</small></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <span class="userinfo" id="userInfo"></span>
  <button class="btn small" id="btnLogout">Keluar</button>
</header>
<main class="container">
  <div class="card">
    <h2 id="sapaan">Selamat datang</h2>
    <p class="muted" id="periodeInfo"></p>
  </div>
  <div id="rekapWrap" class="hidden">
    <h3 class="rekap-judul">📊 Rekap Data</h3>
    <div class="stat-grid" id="rekapGrid"></div>
  </div>
  <div class="menu-grid" id="menuGrid"></div>
</main>
<script src="/js/common.js?v=20261015c"></script>
<script>
const MENU_DETAIL = {
  "/users.html": ["👥", "Pengguna", "Kelola akun admin, guru, dan siswa/ortu."],
  "/guru.html": ["👨‍🏫", "Guru", "Data guru, NIP, dan penugasan mengajar."],
  "/kelas.html": ["🏫", "Kelas", "Data kelas, wali kelas, tahun ajaran."],
  "/siswa.html": ["🧑‍🎓", "Siswa", "Data siswa + akun otomatis, import/export CSV."],
  "/mapel.html": ["📚", "Mata Pelajaran", "12 mapel, urutan tampil, aktif/nonaktif."],
  "/rentang.html": ["📊", "Rentang Nilai", "Tetapkan rentang predikat tiap mapel."],
  "/nilai.html": ["✏️", "Input Nilai", "Input nilai per kelas atau import CSV."],
  "/raport.html": ["📄", "Raport Saya", "Lihat dan cetak raport semester aktif."],
  "/desain.html": ["🎨", "Desain Raport", "Kop raport, kepala sekolah, dan periode aktif."],
  "/wali.html": ["🧑‍🏫", "Catatan Wali Kelas", "Catatan wali + kehadiran S/I/A per siswa."],
  "/bk.html": ["🧠", "Catatan BK", "Catatan bimbingan konseling per siswa."],
  "/ekskul.html": ["⚽", "Catatan Ekskul", "Catatan ekstrakurikuler per siswa."],
  "/leger.html": ["📊", "Leger Nilai", "Rekap nilai per kelas (staf & wali kelas)."],
  "/cetak-kelas.html": ["🖨️", "Cetak per Kelas", "Cetak raport sekelas sekaligus (admin & wali kelas)."],
  "/backup.html": ["💾", "Backup & Restore", "Cadangkan dan pulihkan data per bagian."],
};
(async () => {
  const user = await requireLogin();
  if (!user) return;
  const nama = user.guru_nama || user.siswa_nama || user.username;
  document.getElementById("sapaan").textContent = `Selamat datang, ${nama}!`;
  if (user.role === "admin") {
    const r = await api("/api/admin/statistik");
    if (r.ok) {
      const s = r.data;
      const fmt = (n) => Number(n || 0).toLocaleString("id-ID");
      document.getElementById("rekapGrid").innerHTML = [
        ["👨‍🏫", "Guru", s.guru, "/guru.html"],
        ["🧑‍🎓", "Siswa", s.siswa, "/siswa.html"],
        ["🏫", "Kelas", s.kelas, "/kelas.html"],
        ["📚", "Mata Pelajaran", s.mapel, "/mapel.html"],
      ].map(([icon, label, angka, href]) =>
        `<a class="stat-card" href="${href}">
          <div class="icon">${icon}</div>
          <div class="angka">${fmt(angka)}</div>
          <div class="label">${label}</div>
        </a>`).join("");
      document.getElementById("rekapWrap").classList.remove("hidden");
    }
  }
  const grid = document.getElementById("menuGrid");
  const items = navItems(user).filter(([, href]) => href !== "/");
  grid.innerHTML = items.map(([, href]) => {
    const [icon, judul, desc] = MENU_DETAIL[href] || ["📁", href, ""];
    return `<a class="menu-card" href="${href}">
      <div class="icon">${icon}</div><h3>${esc(judul)}</h3><p>${esc(desc)}</p>
    </a>`;
  }).join("");
})();
</script>
</body>
</html>
