<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raport Saya — GezyRaport</title>
<link rel="stylesheet" href="/css/style.css?v=20261015e">
</head>
<body>
<header class="topbar">
  <div class="brand">🎓 GezyRaport <small>SMPN 1 Punggur</small></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <span class="userinfo" id="userInfo"></span>
  <button class="btn small" id="btnLogout">Keluar</button>
</header>
<main class="container">
  <div class="card">
    <div id="msg" class="alert hidden"></div>
    <div id="isiRaport"><p class="muted">Memuat...</p></div>
    <div class="toolbar no-print">
      <a class="btn gold" id="btnCetak" href="#">🖨 Cetak / Simpan PDF</a>
    </div>
  </div>
</main>
<script src="/js/common.js?v=20261025c"></script>
<script>
function ringkas(data) {
  const id = data.identitas;
  const terisi = data.rows.filter(r => r.nilai !== null);
  const rata = terisi.length
    ? (terisi.reduce((a, b) => a + b.nilai, 0) / terisi.length).toFixed(2)
    : "-";
  // Kop, judul, tempat/tanggal & tanda tangan — sama seperti template cetak
  // (cetak.js), supaya tampilan layar siswa identik dengan dokumen resmi.
  const ttd = data.ttd || {};
  const tempat = ttd.tempat || ttd.kota || "";
  const tanggalTeks = ttd.tanggal_teks || ttd.tanggal || "";
  const kopHtml = data.sekolah.kop
    ? `<div class="kop"><img src="${esc(data.sekolah.kop)}" alt="Kop raport" class="kop-img"></div>`
    : `<div class="kop">
    <h2>${esc(data.sekolah.nama || "SMP NEGERI 1 PUNGGUR")}</h2>
    ${data.sekolah.alamat ? `<p>${esc(data.sekolah.alamat)}</p>` : ""}
  </div>`;
  const judulBaris = String(data.sekolah.judul || "")
    .split(/\r?\n/)
    .map((s) => s.trim())
    .filter(Boolean)
    .map(esc);
  const judulHtml = judulBaris.length
    ? judulBaris.join("<br>")
    : "LAPORAN HASIL BELAJAR PESERTA DIDIK";
  return `
    ${kopHtml}
    <div class="judul-raport"><h3>${judulHtml}</h3></div>
    <table class="identitas">
      <tr><td>Nama</td><td style="width:10px">:</td><td><b>${esc(id.nama)}</b></td>
          <td>Kelas</td><td style="width:10px">:</td><td>${esc(id.kelas || "-")}</td></tr>
      <tr><td>NIS</td><td>:</td><td>${esc(id.nis)}</td>
          <td>Semester</td><td>:</td><td>${esc(id.semester)} — ${esc(id.tahun_ajaran)}</td></tr>
    </table>
    <table class="data">
      <thead><tr><th>No</th><th>Mata Pelajaran</th><th>Nilai</th><th>Predikat</th></tr></thead>
      <tbody>
        ${data.rows.map((r, i) => `<tr>
          <td>${i + 1}</td><td>${esc(r.mapel)}</td>
          <td class="angka" style="text-align:center">${r.nilai !== null ? esc(r.nilai) : "-"}</td>
          <td>${esc(r.predikat || "-")}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <p><b>Rata-rata:</b> ${rata} <span class="muted">(${terisi.length} dari ${data.rows.length} mapel sudah ada nilainya)</span></p>
    <h3>Ketidakhadiran</h3>
    <p>Sakit: <b>${data.kehadiran.sakit}</b> hari &nbsp;•&nbsp; Izin: <b>${data.kehadiran.izin}</b> hari &nbsp;•&nbsp; Tanpa keterangan: <b>${data.kehadiran.alpa}</b> hari</p>
    <div class="ttd-tempat">${esc(tempat)}${tempat ? "," : ""} ${esc(tanggalTeks)}</div>
    <div class="ttd">
      <div class="kolom">Orang Tua/Wali<br><br><br>
        <div class="nama">........................</div>
      </div>
      <div class="kolom">Wali Kelas<br><br><br>
        <div class="nama">${esc(ttd.wali_nama || "........................")}</div>
        ${ttd.wali_nip ? `NIP ${esc(ttd.wali_nip)}` : ""}
      </div>
      <div class="kolom">Kepala Sekolah<br><br><br>
        <div class="nama">${esc(ttd.kepala_nama || "........................")}</div>
        ${ttd.kepala_nip ? `NIP ${esc(ttd.kepala_nip)}` : ""}
      </div>
    </div>`;
}
(async () => {
  const user = await requireLogin();
  if (!user) return;
  const params = new URLSearchParams(location.search);
  const q = user.role === "siswa" ? "" : (params.get("siswa") ? `?siswa_id=${params.get("siswa")}` : "");
  if (!q && user.role !== "siswa") {
    document.getElementById("isiRaport").innerHTML =
      '<p class="muted">Buka raport siswa lewat halaman <a href="/cetak.html">cetak</a> dengan parameter ?siswa=ID.</p>';
    document.getElementById("btnCetak").classList.add("hidden");
    return;
  }
  const r = await api("/api/raport" + q);
  if (!r.ok) {
    showMsg("msg", (r.data && r.data.error) || "Gagal memuat raport", "error");
    document.getElementById("isiRaport").innerHTML = "";
    return;
  }
  document.getElementById("isiRaport").innerHTML = ringkas(r.data);
  const sid = user.role === "siswa" ? user.siswa_id : params.get("siswa");
  document.getElementById("btnCetak").href = `/cetak.html?siswa=${sid}`;
})();
</script>
</body>
</html>
