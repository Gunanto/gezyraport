<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan BK — GezyRaport</title>
<link rel="stylesheet" href="/css/style.css?v=20261015b">
</head>
<body>
<header class="topbar">
  <div class="brand">🎓 GezyRaport <small>SMPN 1 Punggur</small></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <span class="userinfo" id="userInfo"></span>
  <button class="btn small" id="btnLogout">Keluar</button>
</header>
<main class="container">
  <div class="card">
    <h2>🧠 Catatan BK</h2>
    <p class="muted" id="periodeInfo"></p>
    <div id="msg" class="alert hidden"></div>
    <div class="form-grid">
      <label class="field">Kelas <select id="kelas"><option value="">— pilih —</option></select></label>
    </div>
    <div class="toolbar">
      <button class="btn" id="btnMuat" type="button">Muat Daftar Siswa</button>
      <a class="btn green hidden" id="linkTemplate" href="#">⬇ Unduh Template CSV</a>
      <input type="file" id="fileCsv" accept=".csv" class="hidden">
      <button class="btn gold hidden" id="btnImport" type="button">⬆ Import CSV</button>
    </div>
    <p class="muted">Template CSV terisi data yang sudah tersimpan — lanjutkan di Excel lalu import kembali. Kolom: <code>nis,nama,catatan_bk</code> (nis = kunci pencocokan).</p>
  </div>
  <div class="card hidden" id="panelCatatan">
    <h3>Catatan BK <span class="muted" id="infoKelas"></span></h3>
    <div style="overflow-x:auto">
    <table class="data">
      <thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Catatan BK</th></tr></thead>
      <tbody id="barisCatatan"></tbody>
    </table>
    </div>
    <div class="toolbar">
      <button class="btn gold" id="btnSimpan" type="button">💾 Simpan Catatan</button>
    </div>
    <div id="hasilSimpan"></div>
  </div>
</main>
<script src="/js/common.js?v=20261015b"></script>
<script>
const FITUR = "bk", KOLOM = "catatan_bk", JUDUL = "Catatan BK";

async function muat() {
  hideMsg("msg");
  document.getElementById("hasilSimpan").innerHTML = "";
  const kelas_id = document.getElementById("kelas").value;
  if (!kelas_id) return showMsg("msg", "Pilih kelas dulu.", "error");
  const r = await api(`/api/catatan/${FITUR}?kelas_id=${kelas_id}`);
  if (!r.ok) return showMsg("msg", (r.data && r.data.error) || "Gagal memuat", "error");
  const p = r.data.periode;
  document.getElementById("periodeInfo").textContent =
    `Semester ${p.semester} — Tahun Ajaran ${p.tahun_ajaran}`;
  document.getElementById("infoKelas").textContent =
    `(${document.getElementById("kelas").selectedOptions[0].text})`;
  document.getElementById("barisCatatan").innerHTML = r.data.siswa.map((s, i) =>
    `<tr>
      <td>${i + 1}</td><td>${esc(s.nis)}</td><td>${esc(s.nama)}</td>
      <td><textarea class="catatan-input" data-catatan="${s.siswa_id}" placeholder="—">${esc(s[KOLOM] || "")}</textarea></td>
    </tr>`).join("");
  const tpl = document.getElementById("linkTemplate");
  tpl.href = `/api/catatan/${FITUR}/template?kelas_id=${kelas_id}`;
  tpl.classList.remove("hidden");
  document.getElementById("fileCsv").classList.remove("hidden");
  document.getElementById("btnImport").classList.remove("hidden");
  document.getElementById("panelCatatan").classList.remove("hidden");
}

function tampilHasil(box, data) {
  box.innerHTML = `<div class="alert ok">Tersimpan: ${data.tersimpan ?? data.sukses} data.` +
    (data.gagal && data.gagal.length
      ? `<br>Perlu perhatian:<ul>${data.gagal.map(g =>
          `<li>${typeof g === "string" ? esc(g) : `Baris ${g.baris}: ${esc(g.alasan)}`}</li>`).join("")}</ul>`
      : "") + `</div>`;
}

(async () => {
  const user = await requireLogin(["guru", "admin"]);
  if (!user) return;
  if (user.role === "guru" && !user.is_bk) {
    showMsg("msg", "Halaman ini khusus guru BK.", "error");
    return;
  }
  const rk = await api("/api/catatan/kelas?fitur=bk");
  const daftar = rk.ok ? rk.data.kelas : [];
  document.getElementById("kelas").innerHTML = '<option value="">— pilih —</option>' +
    daftar.map(k => `<option value="${k.id}">${esc(k.nama)}</option>`).join("");
  document.getElementById("kelas").addEventListener("change", () => {
    document.getElementById("panelCatatan").classList.add("hidden");
  });
  document.getElementById("btnMuat").addEventListener("click", muat);
  document.getElementById("btnSimpan").addEventListener("click", async () => {
    const kelas_id = Number(document.getElementById("kelas").value);
    const rows = [...document.querySelectorAll("[data-catatan]")].map(ta => ({
      siswa_id: Number(ta.dataset.catatan),
      [KOLOM]: ta.value,
    }));
    const r = await api(`/api/catatan/${FITUR}`, {
      method: "PUT",
      body: JSON.stringify({ kelas_id, rows }),
    });
    const box = document.getElementById("hasilSimpan");
    if (r.ok) { tampilHasil(box, r.data); muat(); }
    else box.innerHTML = `<div class="alert error">${esc((r.data && r.data.error) || "Gagal menyimpan")}</div>`;
  });
  document.getElementById("btnImport").addEventListener("click", async () => {
    const f = document.getElementById("fileCsv").files[0];
    if (!f) return showMsg("msg", "Pilih file CSV dulu.", "error");
    const kelas_id = document.getElementById("kelas").value;
    const fd = new FormData();
    fd.append("file", f);
    const res = await fetch(`/api/catatan/${FITUR}/import?kelas_id=${kelas_id}`, { method: "POST", body: fd });
    const data = await res.json();
    const box = document.getElementById("hasilSimpan");
    if (res.ok) { tampilHasil(box, data); muat(); }
    else box.innerHTML = `<div class="alert error">${esc(data.error || "Import gagal")}</div>`;
  });
})();
</script>
</body>
</html>
