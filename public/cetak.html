<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cetak Raport — GezyRaport</title>
<link rel="stylesheet" href="/css/style.css?v=20261014c">
</head>
<body class="no-footer">
<header class="topbar">
  <div class="brand">🎓 GezyRaport <small>SMPN 1 Punggur</small></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <span class="userinfo" id="userInfo"></span>
  <button class="btn small" id="btnLogout">Keluar</button>
</header>
<main class="container">
  <div class="no-print toolbar" style="margin-bottom:1rem">
    <button class="btn gold" onclick="window.print()">🖨 Cetak / Simpan PDF</button>
    <a class="btn" href="/" >← Kembali</a>
  </div>
  <div id="msg" class="alert hidden no-print"></div>
  <div class="kertas" id="kertas"><p class="muted">Memuat raport...</p></div>
</main>
<script src="/js/common.js?v=20261014c"></script>
<script src="/js/cetak.js?v=20261014c"></script>
<script>
(async () => {
  const user = await requireLogin();
  if (!user) return;
  const params = new URLSearchParams(location.search);
  let q = "";
  if (params.get("siswa")) q = `?siswa_id=${params.get("siswa")}`;
  else if (user.role !== "siswa") {
    document.getElementById("kertas").innerHTML =
      '<p class="muted">Tambahkan parameter ?siswa=ID di URL untuk mencetak raport siswa tertentu.</p>';
    return;
  }
  const r = await api("/api/raport" + q);
  if (!r.ok) {
    showMsg("msg", (r.data && r.data.error) || "Gagal memuat raport", "error");
    document.getElementById("kertas").innerHTML = "";
    return;
  }
  document.getElementById("kertas").innerHTML = renderCetak(r.data);
  document.title = `Raport - ${r.data.identitas.nama}`;
})();
</script>
</body>
</html>
